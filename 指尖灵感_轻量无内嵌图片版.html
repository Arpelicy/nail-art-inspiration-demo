@keyframes homeRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes visualBreath{0%,100%{transform:scale(1.015) translate3d(0,0,0)}50%{transform:scale(1.055) translate3d(-.8%,.5%,0)}}
@keyframes progressGlow{0%,100%{filter:saturate(1);box-shadow:0 0 0 rgba(180,87,202,0)}50%{filter:saturate(1.25);box-shadow:0 0 12px rgba(180,87,202,.24)}}
.home-finder{animation:homeRise .62s cubic-bezier(.2,.7,.2,1) both}
.finder-copy>*{animation:homeRise .55s cubic-bezier(.2,.7,.2,1) both}
.finder-copy>*:nth-child(2){animation-delay:70ms}.finder-copy>*:nth-child(3){animation-delay:120ms}.finder-copy>*:nth-child(4){animation-delay:170ms}.finder-copy>*:nth-child(5){animation-delay:210ms}.finder-copy>*:nth-child(6){animation-delay:250ms}
.finder-visual{overflow:hidden}.finder-visual img{animation:visualBreath 8s ease-in-out infinite;will-change:transform}
.try-progress span{transition:width .42s cubic-bezier(.2,.8,.2,1);animation:progressGlow 2.8s ease-in-out infinite}
.home-card{opacity:0;animation:homeRise .52s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(300ms + var(--delay));transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}
.home-card:hover{transform:translateY(-5px);box-shadow:0 16px 36px #815b3a20}
.home-card-image img{transition:transform .55s cubic-bezier(.2,.7,.2,1)}.home-card:hover .home-card-image img{transform:scale(1.045)}
.home-card.picked{border-color:#d98252;box-shadow:0 0 0 2px #d9825226,0 14px 30px #815b3a16}
.home-card.picked .join-try{background:#d8753d;color:#fff}.home-card.picked .join-try::before{content:'✓ '}
.topbar nav button,.finder-tags button,.try-session button{transition:background-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease}
.finder-tags button:hover,.try-session button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px #6a493316}
@media(prefers-reduced-motion:reduce){.home-finder,.finder-copy>*,.home-card,.finder-visual img,.try-progress span{animation:none!important;opacity:1}.home-card,.topbar nav button,.finder-tags button,.try-session button{transition:none}}

/* Source splitting is automatic in this prototype; manual frame tools are intentionally hidden. */
.ne-split-tools{display:none!important}

/* Render the mapped nail style directly inside each detected hand frame. */
.ne-applied{position:absolute;inset:1px;overflow:hidden;border-radius:46% 46% 38% 38%;pointer-events:none;z-index:1;background:#f7eee8;box-shadow:inset 0 0 0 1px #ffffff80;transform-origin:center}
.ne-applied.flipped{transform:scaleX(-1)}
.ne-applied img{position:absolute;max-width:none;width:581.82%;height:377.86%;top:-136.53%;left:calc(var(--sx) * -100% / 176);pointer-events:none;user-select:none}
.ne-box .ne-num,.ne-box .ne-handle,.ne-box .ne-rotate{z-index:3}

/* Keep the editor focused on mapping and generation. */
.ne-toolbar [data-action="add"],.ne-toolbar [data-action="detect"],.ne-map-actions{display:none!important}
.ne-map{padding:10px 8px}

function drawCommunityFeed(){const feed=q('#communityFeed');if(!feed)return;let posts=communityState.posts.filter(p=>(communityState.category==='全部'||p.category===communityState.category)&&(!communityState.query||`${p.title}${p.author}${p.category}${p.text}`.toLowerCase().includes(communityState.query.toLowerCase())));posts=[...posts].sort((a,b)=>communityState.sort==='hot'?b.likes-a.likes:b.created-a.created);feed.innerHTML=posts.length?posts.map(communityCard).join(''):'<div class="community-empty">没有找到匹配帖子，试试其他关键词。</div>';qa('[data-community-category]').forEach(button=>{const count=button.dataset.communityCategory==='全部'?communityState.posts.length:communityState.posts.filter(p=>p.category===button.dataset.communityCategory).length;button.innerHTML=`${button.dataset.communityCategory}<small>${count||''}</small>`;button.classList.toggle('active',button.dataset.communityCategory===communityState.category)});qa('[data-community-sort]').forEach(button=>button.classList.toggle('active',button.dataset.communitySort===communityState.sort))}

function packUserWordCloud(cloud){const nodes=[...cloud.querySelectorAll('span')].sort((a,b)=>parseFloat(getComputedStyle(b).fontSize)-parseFloat(getComputedStyle(a).fontSize));const width=cloud.clientWidth,height=cloud.clientHeight,placed=[];nodes.forEach(node=>{node.style.transform='translate(-50%,-50%)';const w=node.offsetWidth+5,h=node.offsetHeight+4;let found=null;for(let ring=0;ring<170&&!found;ring+=3){for(let angle=0;angle<360;angle+=7){const rad=angle*Math.PI/180,x=width/2+Math.cos(rad)*ring*1.25,y=height*.49+Math.sin(rad)*ring*.68;const nx=(x-width/2)/(width*.38),ny=(height*.46-y)/(height*.39);const heart=Math.pow(nx*nx+ny*ny-1,3)-nx*nx*Math.pow(ny,3);const box={l:x-w/2,r:x+w/2,t:y-h/2,b:y+h/2};if(heart>0||box.l<8||box.r>width-8||box.t<9||box.b>height-7)continue;if(placed.some(p=>!(box.r+2<p.l||box.l-2>p.r||box.b+2<p.t||box.t-2>p.b)))continue;found={x,y,box};break}}if(found){node.style.left=found.x+'px';node.style.top=found.y+'px';placed.push(found.box)}else{node.style.display='none'}})}

function opsAiAnswer(query){const common={steps:['识别问题目标与统计口径','查询款式、曝光、试戴与确认数据','排除低样本数据并进行交叉验证','整理发现并生成可执行建议']};if(/潜力|转化|TOP|排行/.test(query))return{...common,title:'潜力款转化率 TOP10 分析',thought:'你想了解潜力款中转化率最好的款式。我会先筛选所有上架的潜力款，按转化率降序排列，同时检查曝光量是否足够，避免小样本干扰结论。',summary:'潜力款中「秋日花朵美甲」表现最突出，转化率达到 73.2%，曝光 299、试戴 127、确认 93，样本量足够，结论可信。第二名「清透薄荷海美甲」转化率 46.7%，更适合作为稳定承接款。',findings:['秋日花朵美甲：高转化、高确认，适合进入首页核心推荐位','清透薄荷海美甲：浏览稳定、收藏偏高，适合作为通勤场景承接款','低曝光高转化款共 3 款，暂不建议直接放大流量'],actions:['将秋日花朵美甲提升至首页第 2 推荐位，观察 7 天','为清透薄荷款增加“显白、短甲友好”标签','对低样本潜力款补充至少 50 次有效曝光后再判断']};if(/文案|小红书|标题/.test(query))return{...common,title:'猫眼款内容发布方案',thought:'我会结合近期猫眼款的高互动标题、用户搜索词和试戴评论，提取最有效的卖点，再生成适合小红书语气的标题、正文和互动提问。',summary:'猫眼内容的高互动关键词是“显白、通勤、自然光、短甲友好”。用户更喜欢真实体验感，而不是强调技术参数。建议采用“场景 + 效果 + 反差”的标题结构。',findings:['推荐标题：低调但会发光｜通勤也能驾驭的冰透猫眼','正文重点：室内低调、自然光下细闪、黄皮显白','互动问题：你更喜欢冷调猫眼还是暖调猫眼？'],actions:['首图使用自然光近景，避免高曝光滤镜','正文前两行直接给出显白和短甲效果','发布后 2 小时内回复前 20 条评论']};if(/定价|价格|新客|优惠/.test(query))return{...common,title:'新客定价与转化策略',thought:'我会对比不同价格带的点击、试戴、到店确认和流失率，并区分新客与老客，找到既能降低首次决策门槛、又不会损害客单价的方案。',summary:'新客在 159–189 元区间的试戴转化最高，其中 169 元是当前最平衡的入门价格。低于 139 元会提升点击，但确认率下降；高于 219 元则需要更强的设计感与服务说明。',findings:['159–189 元：新客确认率 24.8%，为最高区间','199–229 元：收藏率高但首次下单周期更长','低价并未显著提升最终成单，容易吸引低意向流量'],actions:['设置 169 元新客体验款，不做全店直接降价','搭配 29 元升级项提升客单价','价格页增加“包含卸甲/护理”说明减少疑虑']};if(/春|夏|色系|流行|趋势/.test(query))return{...common,title:'春夏美甲趋势洞察',thought:'我会综合近 30 天搜索词、收藏增速、试戴确认率和社交内容热度，区分已经流行的稳定款与正在升温的潜力风格。',summary:'春夏最强趋势是低饱和冰透色，其次是奶油黄、薄荷绿和微闪猫眼。纯高饱和色浏览高但确认偏低，更适合用作内容吸引款，而不是大面积铺货。',findings:['冰透裸粉：确认率 31%，适合通勤与日常','薄荷绿：近两周收藏增长 42%，潜力最高','奶油黄：社交互动高，适合节日和拍照场景'],actions:['首页主推冰透裸粉，薄荷绿放潜力推荐位','上新组合保持 60% 稳定款、30% 趋势款、10% 实验款','拍摄时统一使用自然光和浅色背景']};if(/上架|上新|准备/.test(query))return{...common,title:'新款上架准备清单',thought:'我会按“素材、标签、定价、试戴验证、推荐策略、数据监控”六个环节检查上架条件，避免款式上线后因信息不完整影响推荐和转化。',summary:'当前新款上线前最容易遗漏的是甲型适配标签和试戴样本校验。建议每款至少准备 4 张主图、2 个甲型效果和 30 次内部试戴数据后再进入推荐池。',findings:['素材：正面、侧面、自然光、场景图各 1 张','标签：色系、风格、季节、甲型、场景必须完整','数据：完成遮罩、边缘与颜色一致性抽检'],actions:['先进入 10% 流量灰度测试 48 小时','观察点击率、试戴率、确认率三层漏斗','达到基线后再进入首页推荐池']};if(/拍|图片|主图|热门/.test(query))return{...common,title:'美甲主图拍摄优化方案',thought:'我会分析高点击款的构图、光线、手部姿势和背景复杂度，并结合用户端卡片裁切比例给出可直接执行的拍摄规范。',summary:'高点击主图通常使用柔和自然光、单一浅色背景和 45° 手部角度。画面中指甲区域应占 35%–50%，避免饰品或文字遮挡甲面。',findings:['光线：靠窗散射光优于顶灯直射','构图：手指呈扇形展开，主体略偏中心上方','后期：降低锐化与饱和度，保留真实肤色'],actions:['固定 4:5 主图模板并预留卡片裁切安全区','每款同时拍摄近景与佩戴场景图','发布前用用户端卡片预览检查主体是否清晰']};if(/同步|异常|数据/.test(query))return{...common,title:'数据同步异常诊断',thought:'我会检查用户行为事件、款式资料和反馈记录三条数据链路，对比最近同步时间、字段完整率和重复事件比例。',summary:'当前主要异常来自试戴确认事件延迟，约 3.8% 的记录晚于 10 分钟写入；款式资料和反馈记录链路正常。',findings:['tryon_confirm 延迟事件 47 条','重复 view_style 事件比例 0.6%，处于正常范围','款式标签字段完整率 98.9%'],actions:['重试延迟队列并标记补偿写入记录','增加 5 分钟延迟率告警','次日复核确认率是否回补']};return{...common,title:'运营目标综合分析',thought:'我会先理解你的目标，再结合用户偏好、款式表现、推荐位和近期趋势，找出最值得优先执行的动作，并说明判断依据。',summary:'近期用户偏好集中在低饱和、短甲友好和自然显白。首页推荐建议以冰透猫眼和通勤短甲作为稳定承接，同时保留一款高辨识度手绘款探索新兴趣。',findings:['低饱和款试戴确认率高于整体均值 8.4%','短甲友好标签带来更多首次试戴用户','手绘款收藏高，但到店确认周期更长'],actions:['首页前四位放置 2 款稳定款、1 款潜力款、1 款探索款','为稳定款补充肤色与甲型适配标签','7 天后按点击—试戴—确认漏斗复盘']}}
function typeOpsText(el,text,speed=8){return new Promise(resolve=>{let shown=0,last=performance.now(),lastScroll=0;el.textContent='';el.classList.add('is-streaming');const frame=now=>{const add=Math.max(1,Math.floor((now-last)/Math.max(speed,4)));if(add>0){shown=Math.min(text.length,shown+add);el.textContent=text.slice(0,shown);last=now}if(now-lastScroll>140){const sc=q('#opsAiScroll');if(sc&&sc.scrollHeight-sc.scrollTop-sc.clientHeight<260)sc.scrollTop=sc.scrollHeight;lastScroll=now}if(shown<text.length)requestAnimationFrame(frame);else{el.classList.remove('is-streaming');const sc=q('#opsAiScroll');if(sc)sc.scrollTop=sc.scrollHeight;resolve()}};requestAnimationFrame(frame)})}
function opsAiDataset(answer){const ranking=[['秋日花朵美甲','73.2%','299','127','93'],['清透薄荷海美甲','46.7%','65','19','12'],['孔雀蓝显白美甲','27.3%','160','11','9'],['夏日花朵温柔美甲','22.6%','157','53','12'],['番石榴清茶美甲','18.2%','156','15','13'],['粉白渐变温柔美甲','15.4%','206','29','14'],['鹅黄渐变花朵美甲','13.8%','93','33','6'],['薄荷巧克力波点','12.5%','86','8','6'],['粉色醋酸美甲','8.7%','328','49','20'],['豆沙裸温柔美甲','7.1%','133','30','13']];if(/价格|定价/.test(answer.title))return{source:'orders + user_segments',query:'GROUP BY price_bucket, user_type · 近 30 天',columns:['价格带','试戴率','确认率','客单价','样本'],rows:[['139元以下','32.8%','12.1%','¥126','482'],['159–189元','41.6%','24.8%','¥176','1,286'],['199–229元','36.2%','19.4%','¥214','735'],['230元以上','21.7%','13.2%','¥268','318']]};if(/趋势|春夏/.test(answer.title))return{source:'search_events + tryon_events',query:'ORDER BY growth_rate DESC · 近 30 天',columns:['趋势标签','搜索增长','收藏增长','确认率','热度'],rows:[['薄荷绿','+58%','+42%','27.4%','91'],['冰透裸粉','+31%','+28%','31.0%','94'],['奶油黄','+46%','+35%','22.8%','88'],['微闪猫眼','+24%','+19%','29.6%','92'],['高饱和撞色','+17%','+8%','11.3%','76']]};if(/数据同步/.test(answer.title))return{source:'behavior_events + sync_logs',query:'WHERE sync_status != normal · 最近 24 小时',columns:['事件类型','总量','延迟','重复率','状态'],rows:[['tryon_confirm','1,286','47','0.2%','需关注'],['view_style','12,486','18','0.6%','正常'],['add_tryon','2,849','9','0.1%','正常'],['feedback_submit','496','3','0.0%','正常']]};return{source:'styles + behavior_events + recommendations',query:'WHERE status=online AND view_uv>=50 · 近 30 天',columns:['款式名称','转化率','曝光量','试戴量','确认量'],rows:ranking}}
async function streamOpsAnswer(process,result,answer){const thought=process.querySelector('.ops-ai-thought'),steps=process.querySelector('.ops-ai-step-list'),data=opsAiDataset(answer);await typeOpsText(thought,answer.thought,7);for(let i=0;i<answer.steps.length;i++){steps.insertAdjacentHTML('beforeend',`<span class="running"><b>⌕</b><i></i><em></em></span>`);const row=steps.lastElementChild;await typeOpsText(row.querySelector('i'),answer.steps[i],10);await new Promise(r=>setTimeout(r,180));row.className='done';row.querySelector('b').textContent='✓';row.querySelector('em').textContent=i===answer.steps.length-1?'已完成':`${[1286,496,120,10][i]} 条`}process.insertAdjacentHTML('beforeend',`<section class="ops-ai-data-proof"><header><div><b>运营数据查询</b><small>${data.source}</small></div><span>读取中…</span></header><code>SELECT metrics FROM ${data.source}<br>${data.query}</code><div class="ops-ai-data-table"><table><thead><tr>${data.columns.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody></tbody></table></div></section>`);const proof=process.querySelector('.ops-ai-data-proof'),tbody=proof.querySelector('tbody');for(const row of data.rows){tbody.insertAdjacentHTML('beforeend',`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`);await new Promise(r=>setTimeout(r,85));proof.querySelector('span').textContent=`已返回 ${tbody.children.length} 条`}proof.querySelector('span').className='done';await new Promise(r=>setTimeout(r,260));result.classList.remove('pending');result.innerHTML='<small>思考过程　⌄</small><h2></h2><section class="ops-ai-stream-report"></section>';await typeOpsText(result.querySelector('h2'),answer.title,18);const report=result.querySelector('section');report.insertAdjacentHTML('beforeend',`<div class="ops-ai-metric-strip"><span><small>分析样本</small><b>${data.rows.length}</b></span><span><small>数据来源</small><b>${data.source.split(' + ')[0]}</b></span><span><small>统计周期</small><b>近 30 天</b></span></div><h3>数据明细</h3><div class="ops-ai-report-table"><table><thead><tr>${data.columns.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${data.rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);const blocks=[['核心发现',answer.summary],['关键洞察',answer.findings.map((x,i)=>`${i+1}. ${x}`).join('\n')],['建议动作',answer.actions.map((x,i)=>`${i+1}. ${x}`).join('\n')],['结论','建议先执行第一项动作并保留对照组，连续观察 7 天后再扩大流量。以上内容使用页面内模拟运营数据生成，仅用于前端演示。']];for(const block of blocks){report.insertAdjacentHTML('beforeend',`<h3>${block[0]}</h3><p></p>`);await typeOpsText(report.lastElementChild,block[1],6)}q('#opsAiSend').disabled=false}
function opsAiModeWelcome(mode){if(mode==='insight')return `<i>◈</i><h1>选择你要洞察的问题</h1><p>组合数据周期和核心指标，AI 将生成结构化分析。</p><div class="ops-insight-options"><span>数据周期　<b>近 30 天⌄</b></span><span>分析对象　<b>全部款式⌄</b></span><span>核心指标　<b>试戴转化⌄</b></span></div><div>${['分析本月款式趋势和增长机会','对比猫眼与冰透款的用户偏好','找出高浏览低转化的异常款式','分析新客与老客的价格偏好'].map(x=>`<button data-ops-ai-prompt="${x}">${x}</button>`).join('')}</div>`;if(mode==='action')return `<i>➤</i><h1>想执行什么运营动作？</h1><p>AI 会先生成可审核的执行计划，确认后才模拟执行。</p><div class="ops-action-templates">${[['推荐位调整','生成首页 8 个推荐位方案'],['内容发布','为 3 款潜力款生成发布文案'],['标签优化','批量补齐新款风格与甲型标签'],['用户召回','创建高意向未确认用户触达方案']].map(x=>`<button data-ops-ai-prompt="${x[1]}"><b>${x[0]}</b><span>${x[1]}</span><em>→</em></button>`).join('')}</div>`;return `<i>✦</i><h1>今天想做什么？</h1><p>描述你的运营目标，我来拆解执行计划。</p><div>${['最近流行什么美甲风格？','帮我写一段猫眼款的小红书文案','如何定价才能吸引新客？','春夏季最受欢迎的色系是什么？','新款上架前需要做哪些准备？','怎么拍美甲图才容易上热门？'].map(x=>`<button data-ops-ai-prompt="${x}">${x}</button>`).join('')}</div>`}

  q('.ne-file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(file);const img=q('.ne-hand>img');img.onload=()=>{q('.ne-hand').style.aspectRatio=img.naturalWidth+'/'+img.naturalHeight};img.src=objectURL;notice('手图已在本地加载，可拖动识别框调整位置')});
  q('.ne-source-file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);q('.ne-strip').innerHTML=`<img alt="上传的款式参考图" style="grid-column:1/-1;width:100%;max-height:220px;object-fit:contain">`;q('.ne-strip img').src=url;notice('款式图已载入；重切割可恢复示例切片')});
  root.addEventListener('pointerdown',e=>{const el=e.target.closest('.ne-box');if(!el||e.target.closest('button'))return;e.preventDefault();selected=+el.dataset.id;const b=boxes.find(b=>b.id===selected),rect=q('.ne-hand').getBoundingClientRect(),start={x:e.clientX,y:e.clientY,bx:b.x,by:b.y,w:b.w,h:b.h},resize=e.target.dataset.resize;el.setPointerCapture(e.pointerId);const move=ev=>{const dx=(ev.clientX-start.x)/rect.width*100,dy=(ev.clientY-start.y)/rect.height*100;if(resize){b.w=Math.max(2,Math.min(25,start.w+(resize==='w'?-dx:dx)));b.h=Math.max(2,Math.min(25,start.h+(resize==='n'?-dy:dy)))}else{b.x=Math.max(0,Math.min(100-b.w,start.bx+dx));b.y=Math.max(0,Math.min(100-b.h,start.by+dy))}el.style.left=b.x+'%';el.style.top=b.y+'%';el.style.width=b.w+'%';el.style.height=b.h+'%'};const end=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);render()};el.addEventListener('pointermove',move);el.addEventListener('pointerup',end)});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){root.classList.remove('ne-expanded');q('[data-action=expand]').textContent='展开工作区 ⛶';q('.ne-generated')?.remove()}const el=e.target.closest('.ne-box');if(!el||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const b=boxes.find(b=>b.id===+el.dataset.id);b.x+=e.key==='ArrowRight'?.3:e.key==='ArrowLeft'?-.3:0;b.y+=e.key==='ArrowDown'?.3:e.key==='ArrowUp'?-.3:0;render();q('.ne-box[data-id="'+b.id+'"]').focus()});
  let dragId;root.addEventListener('dragstart',e=>{dragId=+e.target.closest('.ne-map')?.dataset.id});root.addEventListener('dragover',e=>{if(e.target.closest('.ne-map'))e.preventDefault()});root.addEventListener('drop',e=>{const row=e.target.closest('.ne-map');if(!row)return;e.preventDefault();const a=boxes.find(b=>b.id===dragId),b=boxes.find(b=>b.id===+row.dataset.id);if(a&&b){[a.style,b.style]=[b.style,a.style];render()}});
  function compose(){const image=q('.ne-hand>img'),canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);boxes.forEach(b=>{const i=b.style??chosen,x=b.x/100*canvas.width,y=b.y/100*canvas.height,w=b.w/100*canvas.width,h=b.h/100*canvas.height;ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(b.r*Math.PI/180);if(b.flip)ctx.scale(-1,1);ctx.beginPath();ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);ctx.clip();ctx.globalAlpha=.9;ctx.drawImage(sourceImage,sx[i],370,176,271,-w/2,-h/2,w,h);ctx.restore()});return canvas}
  function exportImage(){const link=document.createElement('a');link.download='指尖灵感-模拟试戴.png';link.href=compose().toDataURL('image/png');link.click();notice('模拟效果已导出 PNG')}
  function exportAIResult(){const link=document.createElement('a');link.download=`指尖灵感-AI定制${extendedMode?'延长甲':'本甲'}试戴.png`;link.href=currentResult;link.click();notice('AI 定制试戴效果已导出 PNG')}
  function showResult(){q('.ne-generated')?.remove();currentResult=extendedMode?extendedResult:customResult;const modeName=extendedMode?'延长甲':'本甲';const overlay=document.createElement('div');overlay.className='ne-generated';overlay.innerHTML=`<div><img alt="AI 定制${modeName}模拟试戴结果"><p>AI 定制${modeName}效果 · 已同步至总试戴结果</p><button data-action="export-ai">导出 PNG</button> <button data-action="close-result">返回调整</button></div>`;overlay.querySelector('img').src=currentResult;q('.ne-canvas').append(overlay);window.registerCustomTryonResult?.(currentResult,modeName)}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.classList.contains('ne-expanded')){root.classList.remove('ne-expanded');q('[data-action=expand]').textContent='展开工作区 ⛶'}});
  q('.ne-coordinates').addEventListener('input',()=>{const values=[...q('.ne-coordinates').querySelectorAll('input')].map(i=>+i.value);const p=q('.ne-strip [data-piece="'+chosen+'"]');if(p){p.style.transform=`translate(${values[0]-6}px,${values[1]-36}px) rotate(${values[4]}deg)`;p.style.aspectRatio=Math.max(30,values[2])+'/'+Math.max(30,values[3])}});
  createPool(true);
})();

</script>
</body>
